<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>First Gen Employer Portal · Demo</title>
<style>
:root{--navy:#0C1A3B;--brand:#1A9BEF;--bad:#BF2F28}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--navy);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#101828;padding:16px}
form{background:#fff;border-radius:14px;padding:32px;width:100%;max-width:380px;box-shadow:0 20px 48px rgba(0,0,0,.3)}
h1{font-size:20px;margin:0 0 4px}p{margin:0 0 20px;color:#566079;font-size:14px}
input[type=password]{width:100%;padding:11px 12px;border:1px solid #CDD5E3;border-radius:8px;font:inherit}
input:focus{outline:2px solid var(--brand);border-color:var(--brand)}
label.r{display:flex;gap:8px;align-items:center;margin:12px 0 18px;font-size:13px;color:#566079}
button{width:100%;padding:11px;border:0;border-radius:8px;background:var(--brand);color:#fff;font:600 15px inherit;font-family:inherit;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}#err{color:var(--bad);font-size:13px;min-height:18px;margin-top:10px}
small{display:block;margin-top:14px;color:#8791A8;font-size:12px}
</style></head><body>
<form id="f" autocomplete="off">
<h1>First Gen Employer Portal</h1><p>Private demo. Enter the access password to continue.</p>
<input id="pw" type="password" placeholder="Password" aria-label="Password" autofocus required>
<label class="r"><input id="rm" type="checkbox"> Remember on this device</label>
<button id="go">Open demo</button><div id="err" role="alert"></div>
<small>Demo environment. All people and data are fictitious.</small>
</form>
<script>
const ITER=250000, KEY='fg-demo-pw';
let blob=null;
async function load(){ if(!blob){ const r=await fetch('portal.bin',{cache:'no-cache'}); if(!r.ok) throw new Error('fetch'); blob=new Uint8Array(await r.arrayBuffer()); } return blob; }
async function unlock(pw){
  const b=await load(), salt=b.slice(0,16), iv=b.slice(16,28), ct=b.slice(28);
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:ITER,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const html=new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv},key,ct));
  // Fresh iframe gives the portal its own clean page; the address bar keeps the domain.
  const url=URL.createObjectURL(new Blob([html],{type:'text/html'}));
  const fr=document.createElement('iframe'); fr.src=url; fr.title='First Gen Employer Portal';
  fr.style.cssText='position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff';
  document.body.replaceChildren(fr); document.body.style.padding='0';
}
const f=document.getElementById('f'),go=document.getElementById('go'),err=document.getElementById('err');
f.onsubmit=async e=>{ e.preventDefault(); const pw=document.getElementById('pw').value; go.disabled=true; go.textContent='Unlocking…'; err.textContent='';
  try{ await unlock(pw); }
  catch(x){ go.disabled=false; go.textContent='Open demo'; err.textContent= x.message==='fetch' ? 'Could not load the demo. Try again.' : 'That password is not right.'; return; }
};
// Save before unlocking (the page is replaced on success).
f.addEventListener('submit',()=>{ try{ document.getElementById('rm').checked ? localStorage.setItem(KEY,document.getElementById('pw').value) : localStorage.removeItem(KEY);}catch(_){} },true);
(async()=>{ let s=null; try{ s=localStorage.getItem(KEY);}catch(_){} if(s){ try{ await unlock(s);}catch(_){ try{localStorage.removeItem(KEY);}catch(__){} } } })();
</script></body></html>
